name: Android SDK integration

on:
  workflow_dispatch:
  push:
    paths:
      - 'expo-local-doctor'
      - 'tests/**'
      - '.github/workflows/android-integration.yml'
  pull_request:
    paths:
      - 'expo-local-doctor'
      - 'tests/**'
      - '.github/workflows/android-integration.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install and verify real SDK 58 Android dependencies
        run: |
          set -o pipefail
          bash tests/android-integration.sh 2>&1 | tee android-integration.log
      - name: Upload installation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-integration-log
          path: android-integration.log
          if-no-files-found: ignore
